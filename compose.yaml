services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: timetablegenie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d timetablegenie"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment: &application_environment
      DATABASE_URL: postgresql+psycopg://planner:${POSTGRES_PASSWORD}@db:5432/timetablegenie
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: redis
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "backend/worker.py"]
    environment: *application_environment
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
